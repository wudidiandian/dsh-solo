name: 功能建议
description: 提出新功能或改进建议
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: 你想解决什么问题？
      description: 描述当前使用中的痛点或场景
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: 期望的方案
      description: 你希望它怎么工作
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: 涉及端
      multiple: true
      options:
        - App（移动端）
        - agent（电脑端插件）
        - relay（中转服务）
        - 配对页
        - 协议
        - 其他
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 备选方案 / 现有替代
