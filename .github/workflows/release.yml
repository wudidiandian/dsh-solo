name: Release packages
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  packages:
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true
      - name: Load private release configuration and signing key
        env:
          DISTRIBUTION_CONFIG: ${{ secrets.DISTRIBUTION_CONFIG }}
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          node --input-type=module <<'JS'
          import { writeFileSync } from 'node:fs';
          if (!process.env.DISTRIBUTION_CONFIG || !process.env.KEYSTORE_BASE64) throw new Error('Release secrets are required');
          JSON.parse(process.env.DISTRIBUTION_CONFIG);
          writeFileSync('config/distribution.local.json', process.env.DISTRIBUTION_CONFIG);
          writeFileSync(process.env.RUNNER_TEMP + '/release.jks', Buffer.from(process.env.KEYSTORE_BASE64, 'base64'));
          JS
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npm run test:go
      - run: npm run bundle --workspace=dsh-solo-agent
      - name: Package plugin
        run: |
          mkdir release
          npm pack --workspace=dsh-solo-agent --pack-destination release
          cp packages/agent/dist/dsh-solo-agent.bundle.js release/
      - name: Build Android
        working-directory: app
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          flutter pub get
          flutter test
          flutter build apk --release --dart-define-from-file=../.generated/flutter-defines.json
      - name: Collect packages and checksums
        run: |
          cp app/build/app/outputs/flutter-apk/app-release.apk release/dsh-solo.apk
          cd release
          sha256sum *.apk *.tgz *.js > SHA256SUMS
      - name: Create draft GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" release/* --draft --verify-tag --generate-notes
